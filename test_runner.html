<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cal vs Robo - Automated Test Suite</title>
    <style>
      body { background: #111; color: #eee; font-family: monospace; padding: 20px; }
      #status { font-size: 24px; font-weight: bold; margin-bottom: 12px; }
      .pass { color: #4ade80; }
      .fail { color: #f87171; }
      pre { background: #1e1e1e; padding: 12px; border-radius: 6px; }
      canvas { display: none; }
    </style>
  </head>
  <body>
    <canvas id="game" tabindex="0"></canvas>
    <div id="status">INITIALIZING</div>
    <pre id="log"></pre>

    <script src="src/engine/kaboom.js"></script>
    <script type="module">
      import { createGameCore } from "./src/game/core.js";
      import { registerScenes } from "./src/game/scenes/index.js";

      const logEl = document.getElementById("log");
      const statusEl = document.getElementById("status");
      const logs = [];
      const errors = [];

      function log(msg) {
        logs.push(msg);
        logEl.textContent = logs.join("\n");
        console.log(msg);
      }

      function logError(msg, err) {
        const full = `${msg}: ${err ? (err.stack || err.message || err) : ""}`;
        errors.push(full);
        logs.push(`[ERROR] ${full}`);
        logEl.textContent = logs.join("\n");
        console.error(msg, err);
      }

      window.addEventListener("error", (e) => {
        logError(`Uncaught Error: ${e.message} at ${e.filename}:${e.lineno}:${e.colno}`, e.error);
      });

      window.addEventListener("unhandledrejection", (e) => {
        logError("Unhandled Rejection", e.reason);
      });

      try {
        log("1. Initializing game core and scenes...");
        const core = createGameCore();
        registerScenes(core);
        log("Game core initialized successfully.");

        const levelsToTest = [
          "training",
          "level1",
          "level2",
          "desert1",
          "desert2",
          "desert3",
          "desert4",
          "desert5",
          "cloud1",
          "moon1",
          "castle1",
          "castle5_1",
          "castle5_2",
          "castle5_3",
          "castle5_4",
          "castle5_5",
          "boss1",
          "boss2",
          "boss5",
          "secretPowerup",
        ];

        const otherScenesToTest = [
          { name: "intro", args: {} },
          { name: "characterSelect", args: {} },
          { name: "worldMap", args: { worldId: "world1" } },
          { name: "worldMap", args: { worldId: "world2" } },
          { name: "worldMap", args: { worldId: "world3" } },
          { name: "worldMap", args: { worldId: "world4" } },
          { name: "worldMap", args: { worldId: "world5" } },
          { name: "levelClear", args: { levelId: "level1", score: 1000, timeBonus: 500, totalScore: 1500 } },
          { name: "gameOver", args: { levelId: "level1" } },
        ];

        async function waitFrames(frameCount = 5) {
          for (let i = 0; i < frameCount; i++) {
            await new Promise((resolve) => requestAnimationFrame(resolve));
          }
        }

        async function runTests() {
          log("\n2. Testing Other Scenes...");
          for (const s of otherScenesToTest) {
            try {
              go(s.name, s.args);
              await waitFrames(4);
              log(`  [PASS] Scene '${s.name}' (${JSON.stringify(s.args)}) booted and rendered`);
            } catch (err) {
              logError(`  [FAIL] Scene '${s.name}' (${JSON.stringify(s.args)})`, err);
            }
          }

          log("\n3. Testing All 20 Game Levels + Gameplay Mechanics...");
          function pressKey(code, key) {
            window.dispatchEvent(new KeyboardEvent("keydown", { code, key, bubbles: true }));
          }
          function releaseKey(code, key) {
            window.dispatchEvent(new KeyboardEvent("keyup", { code, key, bubbles: true }));
          }

          for (const levelId of levelsToTest) {
            try {
              go("game", { levelId });
              // 1. Initial render & entity setup
              await waitFrames(5);

              // 2. Simulate active player inputs (run right + jump)
              pressKey("ArrowRight", "ArrowRight");
              await waitFrames(8);
              pressKey("Space", " ");
              await waitFrames(10);
              releaseKey("Space", " ");
              await waitFrames(8);
              releaseKey("ArrowRight", "ArrowRight");
              await waitFrames(4);

              // 3. Special level specific checks
              if (levelId === "cloud1") {
                // Test climbing input on cloud level
                pressKey("ArrowUp", "ArrowUp");
                await waitFrames(8);
                releaseKey("ArrowUp", "ArrowUp");
              } else if (levelId === "castle1" || levelId === "castle5_1") {
                // Run additional frames to verify castle backdrop parallax and animated torch flicker
                await waitFrames(10);
              } else if (levelId === "moon1") {
                // Verify moon gravity jumping
                pressKey("Space", " ");
                await waitFrames(12);
                releaseKey("Space", " ");
              }

              log(`  [PASS] Level '${levelId}' simulated with active input & physics`);
            } catch (err) {
              logError(`  [FAIL] Level '${levelId}'`, err);
            }
          }

          log("\n4. Test Suite Summary");
          const passed = errors.length === 0;
          if (passed) {
            statusEl.textContent = "COMPLETE_SUCCESS";
            statusEl.className = "pass";
            log("ALL TESTS PASSED! 20/20 levels and 9 scenes verified with 0 errors.");
          } else {
            statusEl.textContent = "COMPLETE_FAILED";
            statusEl.className = "fail";
            log(`TESTS FAILED with ${errors.length} error(s)!`);
          }

          try {
            await fetch("/api/results", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ passed, errors, logs }),
            });
          } catch (e) {
            console.error("Failed to post results", e);
          }
        }

        onLoad(() => {
          runTests().catch(async (err) => {
            logError("Fatal test runner error", err);
            try {
              await fetch("/api/results", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ passed: false, errors, logs }),
              });
            } catch (_) {}
          });
        });

      } catch (err) {
        logError("Top level initialization error", err);
        statusEl.textContent = "COMPLETE_FAILED";
        fetch("/api/results", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ passed: false, errors, logs }),
        }).catch(() => {});
      }
    </script>
  </body>
</html>
